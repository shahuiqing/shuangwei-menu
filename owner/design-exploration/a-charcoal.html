<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向 A · 炭火账房</title>
<style>
  :root{
    --bg:#0b0a09; --card:#161310; --card2:#1b1713;
    --line:rgba(251,146,60,.14); --line-soft:rgba(255,255,255,.05);
    --brand:#f97316; --ember:#fb923c; --gold:#f59e0b;
    --txt:#f5efe8; --sub:#8a8078; --dim:#5b544d;
    --pos:#34d399; --neg:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 420px at 100% -10%,rgba(249,115,22,.07),transparent 60%);}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 20px 64px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#fb923c,#b45309);
    display:grid;place-items:center;color:#fff;font-weight:900;
    box-shadow:0 0 0 1px rgba(251,146,60,.35),0 8px 20px -8px rgba(249,115,22,.6)}
  .name{font-weight:600;font-size:15px;letter-spacing:.5px}
  .sync{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px rgba(52,211,153,.8)}
  /* 炭火营收卡 */
  .hero{position:relative;border-radius:16px;padding:26px;margin-bottom:14px;overflow:hidden;
    background:linear-gradient(135deg,#241610 0%,#3a1f10 55%,#2a160c 100%);
    border:1px solid rgba(251,146,60,.22);
    box-shadow:0 24px 50px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04);}
  .hero::before{content:"";position:absolute;right:-60px;top:-80px;width:360px;height:260px;
    background:radial-gradient(circle at center,rgba(251,146,60,.38),rgba(234,88,12,.12) 45%,transparent 70%);
    filter:blur(2px)}
  .hero .lbl{font-size:12px;color:var(--gold);letter-spacing:2px}
  .hero .num{font-size:44px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px;
    color:#fff7ed;text-shadow:0 0 26px rgba(251,146,60,.55)}
  .hero .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
    color:#ffd9a8;background:rgba(249,115,22,.16);border:1px solid rgba(251,146,60,.25);border-radius:999px;padding:3px 10px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .kpi .row{display:flex;align-items:flex-start;justify-content:space-between}
  .ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(251,146,60,.16),rgba(234,88,12,.06));
    display:grid;place-items:center;color:var(--ember);font-size:17px;border:1px solid rgba(251,146,60,.22)}
  .kpi .lbl{font-size:12px;color:var(--sub);margin-top:12px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:2px;color:#f5efe8}
  .val.gold{color:var(--gold)} .val.pos{color:var(--pos)}
  .chipup{font-size:11px;font-weight:700;color:#6ee7b7;background:rgba(52,211,153,.1);
    border-radius:999px;padding:2px 8px;border:1px solid rgba(52,211,153,.18)}
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:18px;margin-bottom:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
  .card h3{font-size:15px;font-weight:600;color:#f0e8dd}
  .card .sub{font-size:11px;color:var(--sub);margin-top:2px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:16px}
  .bars i{flex:1;border-radius:5px 5px 0 0;
    background:linear-gradient(180deg,#fb923c,#c2410c)}
  .bars i:nth-child(odd){opacity:.5}
  .bars i:last-child{background:linear-gradient(180deg,#fbbf24,#f97316);box-shadow:0 0 18px -2px rgba(249,115,22,.7)}
  .cats{display:flex;flex-direction:column;gap:11px;margin-top:14px}
  .cat{display:flex;align-items:center;gap:10px;font-size:13px;color:#e8dfd4}
  .cat .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden}
  .cat .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#c2410c,#fb923c)}
  .cat .v{color:var(--sub);font-size:12px;width:56px;text-align:right}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .cell{background:var(--card2);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
  .cell .l{font-size:11px;color:var(--sub)}
  .cell .v{font-size:18px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">双</div><div class="name">炙·双味居</div></div>
    <div class="sync"><span class="dot"></span>炭火余温 · 更新于 23:48</div>
  </div>

  <div class="hero">
    <div class="lbl">今 日 营 收</div>
    <div class="num tnum">¥12,480</div>
    <div><span class="chip">▲ 较昨日 +12.4%</span></div>
  </div>

  <div class="grid">
    <div class="kpi"><div class="row"><div class="ic">单</div><span class="chipup">▲ 8.2%</span></div>
      <div class="lbl">订单数</div><div class="val tnum">186</div></div>
    <div class="kpi"><div class="row"><div class="ic">¥</div><span class="chipup">▲ 3.9%</span></div>
      <div class="lbl">客单价</div><div class="val gold tnum">67.1</div></div>
    <div class="kpi"><div class="row"><div class="ic">利</div><span class="chipup">▲ 15.2%</span></div>
      <div class="lbl">毛利</div><div class="val pos tnum">¥7,320</div></div>
  </div>

  <div class="card">
    <h3>近 7 日营收</h3><div class="sub">单位：元 · 今日还在续火</div>
    <div class="bars"><i style="height:42%"></i><i style="height:60%"></i><i style="height:38%"></i><i style="height:72%"></i><i style="height:55%"></i><i style="height:88%"></i><i style="height:66%"></i></div>
  </div>

  <div class="card">
    <h3>分类占比</h3><div class="sub">今日销量</div>
    <div class="cats">
      <div class="cat">炭烤<span class="bar"><span class="fill" style="width:42%"></span></span><span class="v tnum">42%</span></div>
      <div class="cat">火锅<span class="bar"><span class="fill" style="width:38%"></span></span><span class="v tnum">38%</span></div>
      <div class="cat">酒水<span class="bar"><span class="fill" style="width:12%"></span></span><span class="v tnum">12%</span></div>
      <div class="cat">主食<span class="bar"><span class="fill" style="width:8%"></span></span><span class="v tnum">8%</span></div>
    </div>
  </div>

  <div class="card">
    <h3>本周改善</h3><div class="sub">较上周</div>
    <div class="row3">
      <div class="cell"><div class="l">本周损耗</div><div class="v tnum" style="color:#f87171">¥186</div></div>
      <div class="cell"><div class="l">解决问题</div><div class="v tnum" style="color:#34d399">12 个</div></div>
      <div class="cell"><div class="l">成本率</div><div class="v tnum" style="color:#fbbf24">32.1%</div></div>
    </div>
  </div>
</div>
</body>
</html>
