<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向 B · 明档流水</title>
<style>
  :root{
    --bg:#0b0c0e; --paper:#141519; --paper2:#1b1d22;
    --line:#26282e; --line-soft:#1e2025;
    --cold:#38bdf8; --cold-dim:rgba(56,189,248,.12);
    --txt:#e8eaed; --sub:#7c8188; --dim:#565b62;
    --pos:#34d399; --neg:#f87171;
    --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .tnum{font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 20px 64px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:3px;background:var(--txt);color:var(--bg);
    display:grid;place-items:center;font-weight:800;font-size:14px}
  .name{font-weight:600;font-size:15px;letter-spacing:1px}
  .sync{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;font-family:var(--mono)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cold)}
  /* 收银条式营收汇总 */
  .receipt{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
  .receipt .head{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 18px;border-bottom:1px dashed var(--line)}
  .receipt .head .l{font-size:12px;color:var(--sub);letter-spacing:2px}
  .receipt .head .r{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .receipt .main{display:flex;align-items:baseline;justify-content:space-between;padding:18px}
  .receipt .main .big{font-size:46px;font-weight:700;letter-spacing:-1px;color:var(--cold)}
  .receipt .main .delta{font-size:12px;color:var(--pos);font-family:var(--mono)}
  .receipt .rows{padding:0 18px 6px}
  .receipt .r{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--txt);
    border-top:1px dotted var(--line-soft)}
  .receipt .r .k{color:var(--sub)}
  .receipt .r .v{font-family:var(--mono)}
  .receipt .total{display:flex;justify-content:space-between;padding:12px 18px;border-top:2px solid var(--line);
    font-size:13px;color:var(--cold)}
  .receipt .total .v{font-family:var(--mono);font-weight:700}
  /* 高密度流水表 */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
  .card h3{font-size:13px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;color:var(--dim);font-weight:500;text-align:left;padding:9px 18px;
    border-bottom:1px solid var(--line);letter-spacing:1px}
  th.r,td.r{text-align:right}
  td{padding:10px 18px;border-bottom:1px solid var(--line-soft);color:#d5d8dc}
  tr:last-child td{border-bottom:0}
  td .mono{font-family:var(--mono)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:3px;color:var(--sub);
    background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .tag.on{color:var(--cold);background:var(--cold-dim);border-color:rgba(56,189,248,.3)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:90px;padding:18px}
  .bars i{flex:1;background:var(--cold);border-radius:1px;opacity:.28}
  .bars i:last-child{opacity:1}
  .foot{font-size:11px;color:var(--dim);padding:0 18px 16px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">双</div><div class="name">炙·双味居</div></div>
    <div class="sync"><span class="dot"></span>LIVE 23:48 · 30s</div>
  </div>

  <div class="receipt">
    <div class="head"><span class="l">今日流水单</span><span class="r">2026-10-05 周日</span></div>
    <div class="main">
      <span class="big tnum">¥12,480</span>
      <span class="delta tnum">▲ +12.4%</span>
    </div>
    <div class="rows">
      <div class="r"><span class="k">订单数</span><span class="v">186</span></div>
      <div class="r"><span class="k">客单价</span><span class="v">67.1</span></div>
      <div class="r"><span class="k">毛利</span><span class="v">¥7,320</span></div>
    </div>
    <div class="total"><span>今日合计</span><span class="v">¥12,480</span></div>
  </div>

  <div class="card">
    <h3>最近订单 · 明档</h3>
    <table>
      <tr><th>时间</th><th>桌号</th><th>订单</th><th class="r">金额</th><th>状态</th></tr>
      <tr><td class="mono">23:41</td><td>A12</td><td>炭烤双人 · 火锅锅底</td><td class="r mono">¥328</td><td><span class="tag on">制作中</span></td></tr>
      <tr><td class="mono">23:37</td><td>B03</td><td>和牛炭烤 · 3 菜</td><td class="r mono">¥512</td><td><span class="tag on">制作中</span></td></tr>
      <tr><td class="mono">23:29</td><td>A07</td><td>麻辣锅 · 2 人</td><td class="r mono">¥268</td><td><span class="tag">已上菜</span></td></tr>
      <tr><td class="mono">23:22</td><td>C01</td><td>炭烤拼盘 · 酒水</td><td class="r mono">¥446</td><td><span class="tag">已结账</span></td></tr>
      <tr><td class="mono">23:15</td><td>A12</td><td>加菜 · 牛舌</td><td class="r mono">¥88</td><td><span class="tag">已结账</span></td></tr>
    </table>
  </div>

  <div class="card">
    <h3>近 7 日营收</h3>
    <div class="bars"><i style="height:42%"></i><i style="height:60%"></i><i style="height:38%"></i><i style="height:72%"></i><i style="height:55%"></i><i style="height:88%"></i><i style="height:66%"></i></div>
    <div class="foot">MON 09-29 ── SUN 10-05</div>
  </div>
</div>
</body>
</html>
